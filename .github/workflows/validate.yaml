
name: Validate Survival Cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate application files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "index.html",
              "sw.js",
              "manifest.webmanifest",
              "icon.svg"
          ]

          for name in required:
              path = Path(name)
              assert path.is_file(), f"Missing: {name}"
              assert path.stat().st_size > 0, f"Empty: {name}"
              print("Verified:", name)

          html = Path("index.html").read_text()
          sw = Path("sw.js").read_text()
          manifest = json.loads(
              Path("manifest.webmanifest").read_text()
          )

          assert "./sw.js" in html
          assert "./manifest.webmanifest" in html
          assert "CHECK_OFFLINE_READY" in sw
          assert manifest["start_url"] == "./"
          assert manifest["scope"] == "./"

          print("Application validation passed")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check sw.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inside = True

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False

              def handle_data(self, data):
                  if self.inside and data.strip():
                      self.scripts.append(data)

          parser = ScriptParser()
          parser.feed(Path("index.html").read_text())
          Path("/tmp/osc-inline.js").write_text(
              "\n".join(parser.scripts)
          )
          PY
          node --check /tmp/osc-inline.js
