name: Publish Knowledge Catalog

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon*'
      - 'tools/**'
      - 'tests/**'
      - 'package*.json'
      - 'survival_cache_starter_25.json'
      - 'knowledge/**'
      - 'tools/build_catalog.py'
      - '.github/workflows/publish-library.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate and build Pages and downloadable release
        run: npm run build
      - name: Test application and publishing before deployment
        run: npm test
      - name: Upload downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: offline-survival-cache
          path: dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
